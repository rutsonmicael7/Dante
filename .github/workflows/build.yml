name: Build Dante APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Criar projeto Dante
        run: |
          mkdir -p app/src/main/java/com/rutson/dante/ui
          mkdir -p app/src/main/res/values
          
          cat > settings.gradle << 'EOF'
          include ':app'
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
          }
          android {
            namespace 'com.rutson.dante'
            compileSdk 34
            defaultConfig {
              applicationId "com.rutson.dante"
              minSdk 26
              targetSdk 34
              versionCode 1
              versionName "0.2.0"
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.compose.ui:ui:1.5.8'
            implementation 'androidx.compose.material3:material3:1.1.2'
            implementation 'androidx.activity:activity-compose:1.8.2'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com">
            <application android:allowBackup="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          mkdir -p app/src/main/java/com/rutson/dante
          cat > app/src/main/java/com/rutson/dante/MainActivity.kt << 'EOF'
          package com.rutson.dante
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.material3.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          class MainActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              setContent {
                MaterialTheme {
                  var tab by remember { mutableStateOf(0) }
                  Scaffold(bottomBar = {
                    NavigationBar {
                      NavigationBarItem(selected = tab==0, onClick = {tab=0}, label = {Text("Chat")}, icon = {Text("💬")})
                      NavigationBarItem(selected = tab==1, onClick = {tab=1}, label = {Text("Modelos")}, icon = {Text("🧠")})
                    }
                  }) { pad ->
                    Column(Modifier.padding(pad).padding(16.dp)) {
                      Text("Dante P0 - Funcionando! Próximo passo: adicionar llama.cpp com Qwen3-4B offline")
                    }
                  }
                }
              }
            }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew 2>/dev/null || gradle wrapper --gradle-version 8.4
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dante-APK
          path: app/build/outputs/apk/debug/*.apk
