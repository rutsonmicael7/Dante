name: Build Dante APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Criar estrutura do Dante
        run: |
          mkdir -p app/src/main/java/com/rutson/dante/ui
          mkdir -p app/src/main/java/com/rutson/dante/llama
          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "Dante"
          include(":app")
          EOF

          cat > app/build.gradle.kts << 'EOF'
          plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
            id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
            namespace = "com.rutson.dante"
            compileSdk = 34
            defaultConfig {
              applicationId = "com.rutson.dante"
              minSdk = 26
              targetSdk = 34
              versionCode = 1
              versionName = "0.2.0-P0"
              ndk { abiFilters += listOf("arm64-v8a") }
            }
            buildFeatures { compose = true }
            composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
            packaging { jniLibs { useLegacyPackaging = true } }
            buildTypes { release { isMinifyEnabled = false } }
            compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.compose.ui:ui:1.5.8")
            implementation("androidx.compose.material3:material3:1.1.2")
            implementation("androidx.activity:activity-compose:1.8.2")
            implementation("androidx.lifecycle:lifecycle-runtime-compose:2.7.0")
          }
          EOF

          echo '<resources><string name="app_name">Dante</string></resources>' > app/src/main/res/values/strings.xml
          echo '<resources><style name="Theme.Dante" parent="android:Theme.Material.Light.NoActionBar"/></resources>' > app/src/main/res/values/themes.xml

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com">
            <application android:theme="@style/Theme.Dante" android:allowBackup="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          # Arquivos Kotlin do Dante - versão P0 simples sem NDK por enquanto
          cat > app/src/main/java/com/rutson/dante/MainActivity.kt << 'EOF'
          package com.rutson.dante
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.material3.*
          import com.rutson.dante.ui.DanteApp
          class MainActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              setContent { MaterialTheme { DanteApp() } }
            }
          }
          EOF

          cat > app/src/main/java/com/rutson/dante/ui/DanteApp.kt << 'EOF'
          package com.rutson.dante.ui
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          @Composable
          fun DanteApp() {
            var tab by remember { mutableStateOf(0) }
            Scaffold(bottomBar = {
              NavigationBar {
                NavigationBarItem(selected = tab==0, onClick = {tab=0}, label = {Text("Chat")}, icon = {Text("💬")})
                NavigationBarItem(selected = tab==1, onClick = {tab=1}, label = {Text("Modelos")}, icon = {Text("🧠")})
                NavigationBarItem(selected = tab==2, onClick = {tab=2}, label = {Text("Hardware")}, icon = {Text("📊")})
                NavigationBarItem(selected = tab==3, onClick = {tab=3}, label = {Text("Config")}, icon = {Text("⚙️")})
              }
            }) { pad ->
              Column(Modifier.padding(pad).padding(16.dp)) {
                if (tab==0) Text("Dante P0 - Chat vindo no P0 passo 2 com llama.cpp\n\nEssa versão compila sem NDK. Próximo passo adiciona modelo Qwen3-4B 2.5GB offline.")
                if (tab==1) Text("Catálogo:\n• Qwen3-4B Q4_K_M 2.50GB - Padrão ✅\n• Qwen3-1.7B 1.1GB\n• smolVLM2 1.6GB - Visão")
                if (tab==2) Text("POCO X6 Pro - Dimensity 8300-Ultra\nRAM livre: ~3GB\nVulkan: Sim")
                if (tab==3) Text("Personalidade 100% editável\nNome: Dante\nUsuário: Rutson\nEstilo: Natural")
              }
            }
          }
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
            id("com.android.application") version "8.4.0" apply false
            id("org.jetbrains.kotlin.android") version "1.9.22" apply false
            id("org.jetbrains.kotlin.plugin.compose") version "1.9.22" apply false
          }
          EOF

      - name: Build APK
        run: |
          chmod +x ./gradlew || gradle wrapper --gradle-version 8.4
          ./gradlew assembleDebug || gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dante-APK
          path: app/build/outputs/apk/debug/*.apk
