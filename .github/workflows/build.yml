name: Build Dante P2 OFFLINE
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Criar Dante P2 com llama.cpp
        run: |
          mkdir -p app/src/main/java/com/rutson/dante
          mkdir -p app/src/main/java/com/rutson/dante/ui
          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/res/values

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m
          android.useAndroidX=true
          EOF

          cat > settings.gradle << 'EOF'
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.1.4'
              classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
            }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'
          android {
            namespace 'com.rutson.dante'
            compileSdk 34
            ndkVersion "26.1.10909125"
            defaultConfig {
              applicationId "com.rutson.dante"
              minSdk 26
              targetSdk 34
              versionCode 4
              versionName "0.4.0-P2-OFFLINE"
              externalNativeBuild { cmake { arguments "-DGGML_VULKAN=1", "-DCMAKE_BUILD_TYPE=Release" } }
            }
            buildFeatures { compose = true }
            composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
            externalNativeBuild { cmake { path file("src/main/cpp/CMakeLists.txt") } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = "17" }
            packaging { jniLibs { useLegacyPackaging = true } }
          }
          dependencies {
            implementation 'androidx.core:core-ktx:1.12.0
