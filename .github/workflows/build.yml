name: Build Dante APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - name: Criar projeto
        run: |
          mkdir -p app/src/main/java/com/rutson/dante
          mkdir -p app/src/main/res/values
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          EOF
          cat > settings.gradle << 'EOF'
          include ':app'
          EOF
          cat > build.gradle << 'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.1.4'
              classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.10'
            }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'
          android {
            namespace 'com.rutson.dante'
            compileSdk 34
            defaultConfig { applicationId "com.rutson.dante"; minSdk 26; targetSdk 34; versionCode 2; versionName "0.2.1" }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:allowBackup="true" android:label="Dante" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          echo '<resources><string name="app_name">Dante</string></resources>' > app/src/main/res/values/strings.xml
          cat > app/src/main/java/com/rutson/dante/MainActivity.kt << 'EOF'
          package com.rutson.dante
          import android.app.Activity
          import android.os.Bundle
          import android.widget.TextView
          import android.view.Gravity
          class MainActivity : Activity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              val tv = TextView(this)
              tv.text = "DANTE P0 - FUNCIONOU! 🎉\n\nParabens Rutson, o app abriu!\n\nAgora vamos adicionar:\n1. Chat real\n2. Modelo Qwen3-4B offline (2.5GB)\n3. Hardware info do seu POCO X6 Pro"
              tv.textSize = 18f
              tv.setPadding(60, 200, 60, 60)
              tv.gravity = Gravity.CENTER
              setContentView(tv)
            }
          }
          EOF
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.4 }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: Dante-APK, path: app/build/outputs/apk/debug/*.apk }
